<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1612">
<title>Luna di parole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #1a1612; color: #f4ecdf; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  .shell {
    min-height: 100dvh;
    max-width: 28rem;
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.25rem, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: .85rem;
  }
  .display { font-family: Fraunces, Georgia, serif; }
  header { display: flex; align-items: center; gap: .75rem; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 1.6rem; font-weight: 520; margin: 0; line-height: 1; }
  .muted { color: #b3a48f; margin: .25rem 0 0; }
  .lead { font-family: Fraunces, Georgia, serif; font-size: 1.85rem; line-height: 1.15; margin: 0; }
  .door { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.25rem; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; touch-action: manipulation; }
  .tile {
    aspect-ratio: 1; min-height: 3.25rem; border-radius: .85rem;
    background: #3a3228; color: #f4ecdf; border: 1px solid rgba(244,236,223,.08);
    font-family: Fraunces, Georgia, serif; font-size: 1.55rem;
    display: grid; place-items: center; padding: 0;
  }
  .tile.on { background: #e6c98a; color: #1a1612; border-color: #e6c98a; }
  .tile.hint { outline: 2px solid #e6c98a; outline-offset: 1px; }
  .bar {
    min-height: 3.25rem; border-radius: 1.15rem; background: #2a241c;
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    padding: .45rem .7rem .45rem 1rem;
  }
  .word { font-family: Fraunces, Georgia, serif; font-size: 1.6rem; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    min-height: 3rem; border-radius: 999px; padding: .65rem 1.1rem;
    background: #e6c98a; color: #1a1612; font-weight: 600; border: 0;
  }
  .btn.ghost { background: transparent; color: #f4ecdf; border: 1px solid #6d5c45; }
  .btn:disabled { opacity: .45; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { background: #2a241c; border-radius: 999px; padding: .35rem .7rem; }
  .quiet { background: none; border: 0; color: #b3a48f; padding: .4rem 0; text-align: left; }
  .shake { animation: shake .35s ease; }
  @keyframes shake { 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>
<body>
<main class="shell">
  <header>
    <svg viewBox="0 0 36 36" width="48" height="48" aria-hidden="true">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#6d5c45" stroke-width="3"></circle>
      <circle id="arc" cx="18" cy="18" r="15" fill="none" stroke="#e6c98a" stroke-width="3" stroke-linecap="round" transform="rotate(-90 18 18)" stroke-dasharray="33 94.2"></circle>
      <circle cx="18" cy="18" r="7.5" fill="#e6c98a"></circle>
    </svg>
    <div>
      <h1>Luna di parole</h1>
      <p class="muted" id="sub">Nessuna fretta</p>
    </div>
  </header>
  <section id="door" class="door">
    <p class="lead">Una mano sola. Le lettere aspettano.</p>
    <p class="muted">Tocca le lettere vicine, almeno quattro, e prendile. Non c'è un tempo. Non si perde.</p>
    <button class="btn" id="start">Entro nella notte</button>
    <button class="btn ghost" id="resume" hidden>Riprendo da dove ero</button>
  </section>
  <section id="rest" class="door" hidden>
    <p class="lead">La luna resta qui.</p>
    <p class="muted" id="restline"></p>
    <button class="btn" id="back">Torno</button>
  </section>
  <section id="play" hidden>
    <p class="muted" id="note"></p>
    <div class="grid" id="grid"></div>
    <div class="bar">
      <p class="word" id="built">…</p>
      <button class="btn" id="take" disabled>Prendi</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="clear">Cancella</button>
      <button class="btn ghost" id="hint">Una pista</button>
      <button class="btn ghost" id="sky">Cambia cielo</button>
    </div>
    <div class="chips" id="chips"></div>
    <button class="quiet" id="enough">Basta per ora</button>
  </section>
</main>

    });
  }
  $("sub").textContent = "Notte " + play.night + "  ·  " + play.score;
  $("arc").setAttribute("stroke-dasharray", ((play.moon / MOON) * 94.2) + " 94.2");
  save();
}
function say(note) {
  play.note = note;
  render();
  $("note").classList.add("shake");
}
function left() {
  const have = new Set(play.found);
  return play.words.filter((w) => !have.has(w)).sort((a, b) => a.length - b.length || a.localeCompare(b));
}
function take(word) {
  if (word.length < 4) return say("Servono almeno quattro lettere.");
  if (!knows(word)) return say("Questa non è nel cielo.");
  if (play.found.includes(word)) return say("L'hai già presa.");
  const gained = scoreOf(word);
  let moon = play.moon + gained, night = play.night, hints = play.hints;
  let board = play.board, words = play.words, found = play.found.concat(word);
  let note = word + "  ·  +" + gained;
  const score = play.score + gained;
  const best = Math.max(play.best, score);
  if (moon >= MOON) {
    night += 1; moon = 0; hints = 3;
    board = makeBoard(); words = findWords(board); found = [];
    note = NOTES[(night - 1) % NOTES.length];
  }
  path = []; hint = [];
  play = { board, words, found, score, best, night, moon, hints, note };
  render();
}
function tap(index) {
  hint = [];
  if (!path.length) path = [index];
  else if (path[path.length - 1] === index) path = path.slice(0, -1);
  else if (!path.includes(index) && neighbor(path[path.length - 1], index)) path = path.concat(index);
  render();
}
function openPlay(next) {
  play = next; path = []; hint = [];
  show("play"); render();
}
$("start").addEventListener("click", () => {
  $("start").disabled = true;
  $("start").textContent = "Apro la notte…";
  setTimeout(() => {
    ensureLex();
    const prev = load();
    openPlay(fresh(prev ? prev.best || 0 : 0, 1, 0));
    $("start").disabled = false;
    $("start").textContent = "Entro nella notte";
  }, 30);
});
$("resume").addEventListener("click", () => {
  ensureLex();
  const next = load();
  if (next) openPlay(next);
});
$("back").addEventListener("click", () => { show("play"); render(); });
$("clear").addEventListener("click", () => { path = []; hint = []; render(); });
$("enough").addEventListener("click", () => {
  $("restline").textContent = "Hai " + play.score + (play.score === 1 ? " luce" : " luci") + ". Quando vuoi, si continua.";
  show("rest");
});
$("sky").addEventListener("click", () => {
  const board = makeBoard();
  path = []; hint = [];
  play = Object.assign({}, play, { board, words: findWords(board), found: [], note: "Un cielo nuovo. Il conto resta." });
  render();
});
$("hint").addEventListener("click", () => {
  if (play.hints <= 0) return say("Le piste di questa luna sono finite.");
  const word = left()[0];
  if (!word) return say("Questo cielo è vuoto. Cambiane uno.");
  hint = cellsOf(word);
  path = [];
  play.hints -= 1;
  play.note = "Prova con " + word + ". Se vuoi, la prendo io.";
  render();
});
$("take").addEventListener("click", () => {
  if (hint.length && play.note.indexOf("Prova con ") === 0) {
    take(play.note.slice("Prova con ".length).split(".")[0]);
    return;
  }
  take(path.map((i) => play.board[Math.floor(i / SIZE)][i % SIZE]).join(""));
});
if (localStorage.getItem(KEY)) $("resume").hidden = false;
</script>
</body>
</html>
